<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN">
<html> <head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vocabulary Anagram</title>

<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
<link rel="stylesheet" href="/static/jumble.css" />

</head>

<body>
<div class="container">

  <div class="row">
    <div class="col-xs-6 text-center">
      <h1>Words</h1>
    </div>
  </div>

  <div class="row">
    {% for word in g.vocab %}
      <div class="col-xs-2 text-center"> {{ word }} </div>
      {% if loop.index is divisibleby 3 %}
      </div><div class="row">
      {% endif %}
    {% endfor %}
  </div>

  <br />

  <div class="row">
    <div class="col-xs-6 text-center">Use letters from</div>
  </div>
  <div class="row">
    <div class="col-xs-6 text-center lead"><strong>{{ session.jumble }}</strong></div>
  </div>
  <div class="row">
    <div class="col-xs-6 text-center">to spell {{session.target_count}} words from the list.</div>
  </div>

  <br />

  <div class="row">
    <div class="col-xs-6 text-center">
    <form id="entry">
      <label for="attempt">Word:</label>
      <input id="attempt" name="attempt" type="text" width="15" autocomplete="off" autofocus />
    </form>
    </div>
  </div>

  <br />

  <h2>You found </h2>
  <p id="results">
    {% for match in session.matches %}
    {{ match }} 
    {% endfor %}
  </p>

  <p id="message" class="message"></p>

<script>
// Prevents the form from reloading the page on Enter
$("#entry").submit( function(event) {
   event.preventDefault();
  });

// Monitors every keystroke to validate the word against the backend
$("#attempt").keyup(function(event) {
   var txt = $("#attempt").val();
   
   $.getJSON( "/_check", { text: txt }, 
              function(data) {
                var result = data.result;
                
                // If the game is complete, redirect to the success page
                if (result.finished) {
                    window.location.href = "/success";
                }

                // If a valid word was found, update the list and clear input
                if (result.is_match) {
                    $("#results").append(txt + " ");
                    $("#attempt").val("");
                    $("#message").text("");
                } else {
                    $("#message").text(result.message);
                }
               }
           );
   });
</script>

</div> </body> </html>
